<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

            <i class="fa-solid fa-code"></i>
        </div>

        <p class="text-muted mb-4">
            This page is fully functional in the <strong>PHP/MySQL production version</strong>
            of the system. This GitHub Pages preview showcases only the UI and design.
        </p>
        <div class="alert alert-light border rounded-lg text-start">
            <div class="d-flex gap-3 align-items-start">
                <i class="fa-solid fa-circle-info text-primary mt-1"></i>

            </div>
        </div>

mountShell(role, page, feature, content);
