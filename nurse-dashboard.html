<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nurse Dashboard — RHU Makilala HMIS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head><body>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="assets/js/shell.js"></script>
<script>
const todayList = [
    {time:'9:00', name:'Maria Santos', purpose:'Prenatal checkup', status:'approved'},
    {time:'10:00', name:'Juan Dela Cruz', purpose:'General consultation', status:'pending'},
    {time:'10:30', name:'Pedro Reyes', purpose:'Vaccination', status:'approved'},
    {time:'11:00', name:'Ana Villanueva', purpose:'Follow-up', status:'completed'},
    {time:'14:00', name:'Rosa Aquino', purpose:'BP monitoring', status:'approved'},
];
const statusBadge = s => {
    const map = {pending:'warning', approved:'info', completed:'success', rejected:'danger'};
    return `<span class="badge bg-${map[s]}-subtle text-${map[s]} rounded-pill px-3 py-2">${s.charAt(0).toUpperCase()+s.slice(1)}</span>`;
};

const content = `
<section class="hero">
    <h1>Good day, RHU Nurse 👩‍⚕️</h1>
    <p>Manage today's patient visits, appointments and health records.</p>
    <div class="quick">
        <a class="btn" href="nurse-patients.html"><i class="fa-solid fa-user-plus me-2"></i>Register Patient</a>
        <a class="btn" href="nurse-appointments.html"><i class="fa-solid fa-calendar-plus me-2"></i>New Appointment</a>
        <a class="btn" href="nurse-records.html"><i class="fa-solid fa-notes-medical me-2"></i>New Record</a>
    </div>
</section>

<div class="row g-3 mb-4">
    <div class="col-6 col-md-3"><div class="stat-card stat-green"><div class="icon"><i class="fa-solid fa-user-injured"></i></div><div class="value">247</div><div class="label">Total Patients</div></div></div>
    <div class="col-6 col-md-3"><div class="stat-card stat-blue"><div class="icon"><i class="fa-solid fa-calendar-day"></i></div><div class="value">18</div><div class="label">Today's Appointments</div></div></div>
    <div class="col-6 col-md-3"><div class="stat-card stat-amber"><div class="icon"><i class="fa-solid fa-hourglass-half"></i></div><div class="value">8</div><div class="label">Pending</div></div></div>
    <div class="col-6 col-md-3"><div class="stat-card stat-teal"><div class="icon"><i class="fa-solid fa-circle-check"></i></div><div class="value">24</div><div class="label">Completed</div></div></div>
</div>

<div class="row g-3">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-header"><i class="fa-solid fa-chart-line text-primary me-2"></i>New Patients & Appointments (12 months)</div>
            <div class="card-body"><div class="chart-wrap" style="position:relative;height:300px"><canvas id="chart"></canvas></div></div>
        </div>
    </div>
    <div class="col-lg-5">
        <div class="card">
            <div class="card-header"><i class="fa-solid fa-calendar-day text-primary me-2"></i>Today's Schedule</div>
            <div class="card-body p-0">
                <ul class="list-unstyled m-0">
                    ${todayList.map(a => `
                        <li class="d-flex gap-3 p-3 border-bottom">
                            <div style="width:52px;height:52px;border-radius:14px;background:#DCFCE7;color:#166534;display:flex;align-items:center;justify-content:center;font-weight:700">${a.time}</div>
                            <div class="flex-grow-1">
                                <div class="fw-semibold">${a.name}</div>
                                <small class="text-muted">${a.purpose}</small>
                            </div>
                            ${statusBadge(a.status)}
                        </li>
                    `).join('')}
                </ul>
            </div>
        </div>
    </div>
</div>
`;

mountShell('nurse', 'dashboard', 'Nurse Dashboard', content);

const labels = ['Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'];
new Chart(document.getElementById('chart'), {
    type:'bar',
    data:{labels, datasets:[
        {label:'New Patients', data:[12,18,15,22,25,20,28,32,35,29,38,42], backgroundColor:'#16A34A', borderRadius:8},
        {label:'Appointments', data:[45,52,48,60,55,58,65,72,68,75,82,88], backgroundColor:'#4ADE80', borderRadius:8},
    ]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true}}}
});
</script>
</body></html>
