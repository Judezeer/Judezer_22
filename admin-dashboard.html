<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin Dashboard — RHU Makilala HMIS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="assets/js/shell.js"></script>

<script>
const content = `
<section class="hero">
    <h1>Welcome, System Administrator 👋</h1>
    <p>Here's a snapshot of the Rural Health Unit's operations today — patients, appointments, medicine stock and dispensing at a glance.</p>
    <div class="quick">
        <a href="admin-patients.html" class="btn"><i class="fa-solid fa-user-plus me-2"></i>Add Patient</a>
        <a href="admin-appointments.html" class="btn"><i class="fa-solid fa-calendar-plus me-2"></i>New Appointment</a>
        <a href="admin-medicines.html" class="btn"><i class="fa-solid fa-pills me-2"></i>Medicines</a>
        <a href="admin-reports.html" class="btn"><i class="fa-solid fa-chart-line me-2"></i>Reports</a>
    </div>
</section>

<div class="stock-alert-banner warning">
    <div class="alert-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <div class="alert-body">
        <div class="alert-title">🔔 3 Medicines Running Low</div>
        <div class="alert-msg">These items are at or below their reorder level. Consider restocking soon.</div>
        <div class="alert-chips">
            <span class="stock-alert-chip">Amoxicillin 500mg · 12 pieces left</span>
            <span class="stock-alert-chip">Paracetamol 500mg · 8 pieces left</span>
            <span class="stock-alert-chip">Ibuprofen 200mg · 15 pieces left</span>
        </div>
    </div>
    <a class="alert-action" href="admin-medicines.html">Review Stock <i class="fa-solid fa-arrow-right ms-1"></i></a>
</div>

<div class="row g-3 mb-4">
    <div class="col-6 col-md-4 col-xl-2"><div class="stat-card stat-green"><div class="icon"><i class="fa-solid fa-user-injured"></i></div><div class="value">247</div><div class="label">Total Patients</div></div></div>
    <div class="col-6 col-md-4 col-xl-2"><div class="stat-card stat-blue"><div class="icon"><i class="fa-solid fa-calendar-day"></i></div><div class="value">18</div><div class="label">Today's Appointments</div></div></div>
    <div class="col-6 col-md-4 col-xl-2"><div class="stat-card stat-teal"><div class="icon"><i class="fa-solid fa-pills"></i></div><div class="value">86</div><div class="label">Available Medicines</div></div></div>
    <div class="col-6 col-md-4 col-xl-2"><div class="stat-card stat-amber"><div class="icon"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="value">3</div><div class="label">Low Stock</div></div></div>
    <div class="col-6 col-md-4 col-xl-2"><div class="stat-card stat-red"><div class="icon"><i class="fa-solid fa-circle-exclamation"></i></div><div class="value">2</div><div class="label">Expired</div></div></div>
    <div class="col-6 col-md-4 col-xl-2"><div class="stat-card stat-purple"><div class="icon"><i class="fa-solid fa-prescription-bottle-medical"></i></div><div class="value">42</div><div class="label">Dispensed Today</div></div></div>
</div>

<div class="row g-3">
    <div class="col-lg-8">
        <div class="card mb-3">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fa-solid fa-chart-line text-primary me-2"></i>Monthly Trends</span>
                <div class="d-flex gap-2 align-items-center">
                    <span class="legend-dot" style="background:#16A34A"></span><small class="text-muted me-2">Patients</small>
                    <span class="legend-dot" style="background:#0EA5E9"></span><small class="text-muted me-2">Appointments</small>
                    <span class="legend-dot" style="background:#F59E0B"></span><small class="text-muted">Dispensing</small>
                </div>
            </div>
            <div class="card-body"><div class="chart-wrap" style="position:relative;height:320px"><canvas id="monthChart"></canvas></div></div>
        </div>
    </div>

    <div class="col-lg-4">
        <div class="card mb-3">
            <div class="card-header"><i class="fa-solid fa-chart-pie text-primary me-2"></i>Appointments by Status</div>
            <div class="card-body">
                <div class="chart-wrap" style="position:relative;height:260px"><canvas id="statusChart"></canvas></div>
                <div id="statusLegend" class="mt-3"></div>
            </div>
        </div>
    </div>

    <div class="col-12">
        <div class="card">
            <div class="card-header"><i class="fa-solid fa-clock-rotate-left text-primary me-2"></i>Recent Activity</div>
            <div class="card-body p-0">
                <ul class="list-unstyled m-0">
                    ${[
                        {act:'Insert', mod:'patients', desc:'Created patient #248 (Maria Santos)', user:'RHU Nurse', time:'5 minutes ago'},
                        {act:'Dispense', mod:'dispensing', desc:'Dispense #RX-20260815-0042 (3 items)', user:'RHU Pharmacist', time:'12 minutes ago'},
                        {act:'Update', mod:'appointments', desc:'Set status of #47 to completed', user:'RHU Nurse', time:'25 minutes ago'},
                        {act:'Stock_in', mod:'inventory', desc:'Batch #B-2026-08-15 (+200 pieces)', user:'RHU Pharmacist', time:'1 hour ago'},
                        {act:'Login', mod:'auth', desc:'User signed in.', user:'System Administrator', time:'2 hours ago'},
                    ].map(r => `
                        <li class="d-flex gap-3 p-3 border-bottom">
                            <div class="flex-shrink-0" style="width:36px;height:36px;border-radius:12px;background:#DCFCE7;color:#166534;display:flex;align-items:center;justify-content:center"><i class="fa-solid fa-circle-check"></i></div>
                            <div class="flex-grow-1">
                                <div class="fw-semibold" style="font-size:13px">${r.act} · ${r.mod}</div>
                                <div class="text-muted" style="font-size:12px">${r.desc}</div>
                                <small class="text-muted">${r.time} · ${r.user}</small>
                            </div>
                        </li>
                    `).join('')}
                </ul>
            </div>
        </div>
    </div>
</div>
`;

mountShell('admin', 'dashboard', 'Admin Dashboard', content);

// Charts
const labels = ['Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'];
const monthCtx = document.getElementById('monthChart').getContext('2d');
const grad = c => { const g = monthCtx.createLinearGradient(0,0,0,320); g.addColorStop(0,c+'55'); g.addColorStop(1,c+'00'); return g; };

new Chart(monthCtx, {
    type:'line',
    data:{labels, datasets:[
        {label:'New Patients', data:[12,18,15,22,25,20,28,32,35,29,38,42], borderColor:'#16A34A', backgroundColor:grad('#16A34A'), tension:.4, fill:true, borderWidth:3, pointRadius:0, pointHoverRadius:6},
        {label:'Appointments', data:[45,52,48,60,55,58,65,72,68,75,82,88], borderColor:'#0EA5E9', backgroundColor:grad('#0EA5E9'), tension:.4, fill:true, borderWidth:3, pointRadius:0, pointHoverRadius:6},
        {label:'Dispensing', data:[35,42,38,50,48,52,58,65,62,70,75,82], borderColor:'#F59E0B', backgroundColor:grad('#F59E0B'), tension:.4, fill:true, borderWidth:3, pointRadius:0, pointHoverRadius:6},
    ]},
    options:{responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
        plugins:{legend:{display:false}, tooltip:{backgroundColor:'#0F172A', padding:12, cornerRadius:10}},
        scales:{x:{grid:{display:false}, ticks:{color:'#64748B', font:{size:11}}}, y:{beginAtZero:true, border:{display:false}, grid:{color:'rgba(148,163,184,.15)'}, ticks:{color:'#64748B'}}}
    }
});

const status = {pending:8, approved:12, completed:24, rejected:2, cancelled:3, rescheduled:1};
const sColors = {pending:'#F59E0B', approved:'#0EA5E9', completed:'#16A34A', rejected:'#DC2626', cancelled:'#64748B', rescheduled:'#8B5CF6'};
new Chart(document.getElementById('statusChart'), {
    type:'doughnut',
    data:{labels:Object.keys(status), datasets:[{data:Object.values(status), backgroundColor:Object.keys(status).map(k=>sColors[k]), borderWidth:3, borderColor:'#fff', hoverOffset:8}]},
    options:{responsive:true, maintainAspectRatio:false, cutout:'70%',
        plugins:{legend:{display:false}, tooltip:{backgroundColor:'#0F172A', padding:12, cornerRadius:10,
            callbacks:{label:ctx=>{ const t=ctx.dataset.data.reduce((a,b)=>a+b,0); return ' '+ctx.label+': '+ctx.parsed+' ('+Math.round(ctx.parsed/t*100)+'%)'; }}}}
    }
});
const total = Object.values(status).reduce((a,b)=>a+b,0);
document.getElementById('statusLegend').innerHTML = Object.entries(status).map(([k,v])=>{
    const pct = Math.round(v/total*100);
    return `<div class="d-flex justify-content-between py-1" style="font-size:13px"><span><span class="legend-dot" style="background:${sColors[k]}"></span>${k.charAt(0).toUpperCase()+k.slice(1)}</span><span class="text-muted fw-semibold">${v} <small>(${pct}%)</small></span></div>`;
}).join('');
</script>
</body>
</html>
