<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pharmacist Dashboard — RHU Makilala HMIS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head><body>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="assets/js/shell.js"></script>
<script>
const lowList = [
    {name:'Amoxicillin 500mg', code:'MED-001', stock:12, unit:'capsules'},
    {name:'Paracetamol 500mg', code:'MED-002', stock:8, unit:'tablets'},
    {name:'Ibuprofen 200mg', code:'MED-003', stock:15, unit:'tablets'},
    {name:'Cetirizine 10mg', code:'MED-004', stock:18, unit:'tablets'},
];
const expList = [
    {name:'Paracetamol 500mg', batch:'B-2024-08', expiry:'Aug 01, 2025'},
    {name:'Amoxicillin 250mg/5ml', batch:'B-2024-11', expiry:'Nov 15, 2025'},
];

const content = `
<section class="hero">
    <h1>Pharmacy Overview 💊</h1>
    <p>Track stocks, expiring batches and today's dispensing activity.</p>
    <div class="quick">
        <a class="btn" href="pharmacist-medicines.html"><i class="fa-solid fa-plus me-2"></i>Add Medicine</a>
        <a class="btn" href="pharmacist-batches.html"><i class="fa-solid fa-box me-2"></i>Stock In</a>
        <a class="btn" href="pharmacist-dispensing.html"><i class="fa-solid fa-prescription-bottle-medical me-2"></i>Dispense</a>
    </div>
</section>

<div class="stock-alert-banner danger">
    <div class="alert-icon"><i class="fa-solid fa-circle-exclamation"></i></div>
    <div class="alert-body">
        <div class="alert-title">⚠️ 2 Expired Batches Detected</div>
        <div class="alert-msg">These medicines have already expired and should be removed from usable stock immediately.</div>
        <div class="alert-chips">
            ${expList.map(b => `<span class="stock-alert-chip">${b.name} · Batch ${b.batch}</span>`).join('')}
        </div>
    </div>
    <a class="alert-action" href="pharmacist-batches.html">Manage Batches <i class="fa-solid fa-arrow-right ms-1"></i></a>
</div>

<div class="stock-alert-banner warning">
    <div class="alert-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <div class="alert-body">
        <div class="alert-title">🔔 4 Medicines Running Low</div>
        <div class="alert-msg">These items are at or below their reorder level. Consider restocking soon.</div>
        <div class="alert-chips">
            ${lowList.map(m => `<span class="stock-alert-chip">${m.name} · ${m.stock} left</span>`).join('')}
        </div>
    </div>
    <a class="alert-action" href="pharmacist-medicines.html">Review Stock <i class="fa-solid fa-arrow-right ms-1"></i></a>
</div>

<div class="row g-3 mb-4">
    <div class="col-6 col-md-3"><div class="stat-card stat-green"><div class="icon"><i class="fa-solid fa-pills"></i></div><div class="value">86</div><div class="label">Available Medicines</div></div></div>
    <div class="col-6 col-md-3"><div class="stat-card stat-amber"><div class="icon"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="value">4</div><div class="label">Low Stock</div></div></div>
    <div class="col-6 col-md-3"><div class="stat-card stat-red"><div class="icon"><i class="fa-solid fa-circle-exclamation"></i></div><div class="value">2</div><div class="label">Expired</div></div></div>
    <div class="col-6 col-md-3"><div class="stat-card stat-purple"><div class="icon"><i class="fa-solid fa-prescription-bottle-medical"></i></div><div class="value">42</div><div class="label">Dispensed Today</div></div></div>
</div>

<div class="row g-3">
    <div class="col-lg-7">
        <div class="card mb-3">
            <div class="card-header"><i class="fa-solid fa-chart-line text-primary me-2"></i>Dispensing Trend (12 months)</div>
            <div class="card-body"><div class="chart-wrap" style="position:relative;height:280px"><canvas id="dispChart"></canvas></div></div>
        </div>
    </div>
    <div class="col-lg-5">
        <div class="card mb-3">
            <div class="card-header text-warning fw-semibold"><i class="fa-solid fa-triangle-exclamation me-2"></i>Low Stock</div>
            <ul class="list-unstyled m-0">
                ${lowList.map(m => `
                    <li class="d-flex justify-content-between p-3 border-bottom">
                        <div><div class="fw-semibold">${m.name}</div><small class="text-muted">${m.code}</small></div>
                        <span class="badge bg-warning-subtle text-warning rounded-pill px-3 py-2">${m.stock} ${m.unit}</span>
                    </li>
                `).join('')}
            </ul>
        </div>
        <div class="card">
            <div class="card-header text-danger fw-semibold"><i class="fa-solid fa-circle-exclamation me-2"></i>Expired Batches</div>
            <ul class="list-unstyled m-0">
                ${expList.map(b => `
                    <li class="d-flex justify-content-between p-3 border-bottom">
                        <div><div class="fw-semibold">${b.name}</div><small class="text-muted">Batch ${b.batch}</small></div>
                        <span class="badge bg-danger-subtle text-danger rounded-pill px-3 py-2">${b.expiry}</span>
                    </li>
                `).join('')}
            </ul>
        </div>
    </div>
</div>
`;

mountShell('pharmacist', 'dashboard', 'Pharmacist Dashboard', content);

const ctx = document.getElementById('dispChart').getContext('2d');
const grad = ctx.createLinearGradient(0,0,0,280);
grad.addColorStop(0,'#16A34A55'); grad.addColorStop(1,'#16A34A00');

new Chart(ctx, {
    type:'line',
    data:{labels:['Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'],
        datasets:[{label:'Items Dispensed', data:[125,152,138,190,175,182,215,248,232,275,298,320], borderColor:'#16A34A', backgroundColor:grad, tension:.4, fill:true, borderWidth:3, pointRadius:0}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{backgroundColor:'#0F172A', padding:12, cornerRadius:10}}, scales:{x:{grid:{display:false}}, y:{beginAtZero:true, grid:{color:'rgba(148,163,184,.15)'}}}}
});
</script>
</body></html>
