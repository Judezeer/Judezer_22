<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Dashboard — RHU Makilala HMIS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
</head><body>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/shell.js"></script>
<script>
const upcoming = [
    {date:'Aug 22, 2026', time:'10:00 AM', purpose:'General consultation', status:'approved'},
    {date:'Sep 05, 2026', time:'2:00 PM', purpose:'Follow-up', status:'pending'},
];
const records = [
    {date:'Aug 15, 2026', type:'Consultation', diagnosis:'Common cold', treatment:'Rest, hydration, paracetamol'},
    {date:'Jul 20, 2026', type:'Vaccination', diagnosis:'COVID-19 booster', treatment:'Vaccine administered'},
    {date:'Jun 10, 2026', type:'Consultation', diagnosis:'Hypertension check', treatment:'Continue medication'},
];
const notifs = [
    {title:'Appointment Approved', msg:'Your appointment on Aug 22, 2026 has been approved.', time:'1 hour ago'},
    {title:'Welcome to RHU Makilala', msg:'You can now book appointments online.', time:'2 days ago'},
];
const statusBadge = s => {
    const map = {pending:'warning', approved:'info', completed:'success', rejected:'danger'};
    return `<span class="badge bg-${map[s]}-subtle text-${map[s]} rounded-pill px-3 py-2">${s.charAt(0).toUpperCase()+s.slice(1)}</span>`;
};

const content = `
<section class="hero">
    <h1>Hello, Juan Dela Cruz 👋</h1>
    <p>View your upcoming appointments, medical history and notifications from the RHU.</p>
    <div class="quick">
        <a class="btn" href="patient-book.html"><i class="fa-solid fa-calendar-plus me-2"></i>Book Appointment</a>
        <a class="btn" href="patient-records.html"><i class="fa-solid fa-notes-medical me-2"></i>Medical Records</a>
        <a class="btn" href="patient-profile.html"><i class="fa-solid fa-user me-2"></i>My Profile</a>
    </div>
</section>

<div class="row g-3">
    <div class="col-lg-8">
        <div class="card mb-3">
            <div class="card-header"><i class="fa-solid fa-calendar-check text-primary me-2"></i>Upcoming Appointments</div>
            <div class="card-body p-0">
                <table class="table mb-0">
                    <thead><tr><th>Date</th><th>Time</th><th>Purpose</th><th>Status</th></tr></thead>
                    <tbody>
                        ${upcoming.map(a => `<tr><td>${a.date}</td><td>${a.time}</td><td>${a.purpose}</td><td>${statusBadge(a.status)}</td></tr>`).join('')}
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><i class="fa-solid fa-notes-medical text-primary me-2"></i>Recent Medical Records</div>
            <div class="card-body p-0">
                <table class="table mb-0">
                    <thead><tr><th>Date</th><th>Type</th><th>Diagnosis</th><th>Treatment</th></tr></thead>
                    <tbody>
                        ${records.map(r => `<tr><td>${r.date}</td><td>${r.type}</td><td>${r.diagnosis}</td><td>${r.treatment}</td></tr>`).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="col-lg-4">
        <div class="card mb-3">
            <div class="card-body text-center">
                <div class="mx-auto mb-3" style="width:96px;height:96px;border-radius:32px;background:linear-gradient(135deg,#DCFCE7,#4ADE80);display:flex;align-items:center;justify-content:center;color:#166534;font-weight:700;font-size:32px">JD</div>
                <h5 class="fw-bold mb-0">Juan Dela Cruz</h5>
                <small class="text-muted">PT-000001</small>
                <div class="d-flex justify-content-center gap-2 mt-2">
                    <span class="badge bg-primary-subtle text-success rounded-pill px-3 py-2">35 yrs</span>
                    <span class="badge bg-danger-subtle text-danger rounded-pill px-3 py-2">O+</span>
                </div>
                <hr>
                <div class="text-start small">
                    <div class="mb-1"><i class="fa-solid fa-phone text-muted me-2"></i>0920 123 4567</div>
                    <div class="mb-1"><i class="fa-solid fa-envelope text-muted me-2"></i>patient@rhu-makilala.gov.ph</div>
                    <div class="mb-1"><i class="fa-solid fa-location-dot text-muted me-2"></i>Poblacion, Makilala</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><i class="fa-solid fa-bell text-primary me-2"></i>Notifications</div>
            <ul class="list-unstyled m-0">
                ${notifs.map(n => `
                    <li class="p-3 border-bottom">
                        <div class="fw-semibold">${n.title}</div>
                        <small class="text-muted">${n.msg}</small>
                        <div><small class="text-muted">${n.time}</small></div>
                    </li>
                `).join('')}
            </ul>
        </div>
    </div>
</div>
`;

mountShell('patient', 'dashboard', 'My Dashboard', content);
</script>
</body></html>
